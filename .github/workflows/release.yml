name: VocalPro v3 Release Packaging

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build Windows All-in-One Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Frontend Dependencies & Build UI
        run: |
          npm install
          npm run build

      - name: Build Rust Desktop Release Binary (Tauri Shell + Embedded Frontend)
        run: |
          npx tauri build --no-bundle -f desktop-shell

      - name: Stage Release Bundle & Preload Model
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist\bundle\engine
          New-Item -ItemType Directory -Force -Path dist\bundle\models
          New-Item -ItemType Directory -Force -Path dist\installer

          # 1. Download official Python 3.11 embeddable runtime
          $pyUrl = "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip"
          $pyZip = "python-3.11.9-embed-amd64.zip"
          Invoke-WebRequest -Uri $pyUrl -OutFile $pyZip
          Expand-Archive -Path $pyZip -DestinationPath dist\bundle\engine -Force
          Remove-Item $pyZip

          # 2. Enable site-packages in python311._pth
          $pthFile = "dist\bundle\engine\python311._pth"
          if (Test-Path $pthFile) {
              $content = Get-Content $pthFile
              $content = $content -replace '#import site', 'import site'
              $content += "`n."
              $content += "`nLib\site-packages"
              $content | Set-Content $pthFile
          }

          # 3. Bootstrap pip into embeddable runtime
          $getPipUrl = "https://bootstrap.pypa.io/get-pip.py"
          Invoke-WebRequest -Uri $getPipUrl -OutFile dist\bundle\engine\get-pip.py
          & dist\bundle\engine\python.exe dist\bundle\engine\get-pip.py --no-warn-script-location
          Remove-Item dist\bundle\engine\get-pip.py

          # 4. Install PyTorch CPU, Demucs, and audio processing dependencies
          & dist\bundle\engine\python.exe -m pip install --timeout 120 --retries 5 torch torchaudio --index-url https://download.pytorch.org/whl/cpu --no-warn-script-location
          & dist\bundle\engine\python.exe -m pip install --timeout 120 --retries 5 demucs soundfile numpy scipy librosa noisereduce mido resampy platformdirs --no-warn-script-location

          # 5. Download static 64-bit ffmpeg.exe
          $ffmpegUrl = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip"
          $ffmpegZip = "ffmpeg.zip"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $ffmpegZip
          Expand-Archive -Path $ffmpegZip -DestinationPath ffmpeg_extracted -Force
          $ffmpegExe = Get-ChildItem -Path ffmpeg_extracted -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination dist\bundle\ffmpeg.exe
          Remove-Item -Recurse -Force ffmpeg_extracted, $ffmpegZip

          # 6. Preload and verify offline Demucs default model weights
          $env:PYTHONPATH = "$PWD\worker"
          & dist\bundle\engine\python.exe -m vocalpro_worker.model_installer htdemucs --target dist\bundle\models

          # 7. Copy native Tauri executable to bundle
          Copy-Item src-tauri\target\release\vocalpro.exe -Destination dist\bundle\vocalpro.exe

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        shell: powershell

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VocalPro-v3.0.0-Windows-Setup
          path: dist/installer/*.exe
          retention-days: 30

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.0.0' }}
          files: |
            dist/installer/*.exe
            dist/bundle/vocalpro.exe
            release/VocalPro-v3.0.0-Windows.zip
          name: VocalPro v3.0.0 Windows All-in-One
          draft: false
          prerelease: false
          generate_release_notes: false

